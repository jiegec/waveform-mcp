[package]
name = "waveform-mcp"
version = "0.6.0"
edition = "2024"
description = "MCP server for reading VCD/FST waveform files using the wellen library"
license = "MIT"
readme = "README.md"
authors = ["Jiajie Chen <c@jia.je>"]
repository = "https://github.com/jiegec/waveform-mcp"
keywords = ["waveform", "vcd", "fst", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "waveform-mcp"
path = "src/main.rs"

[[bin]]
name = "waveform-cli"
path = "src/bin/waveform-cli.rs"

[dependencies]
wellen = "0.25.7"
rmcp = { version = "3.6.0", features = ["transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.92"
futures = "0.3.34"
lalrpop-util = { version = "0.23.2", features = ["lexer"] }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"

[build-dependencies]
lalrpop = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"
